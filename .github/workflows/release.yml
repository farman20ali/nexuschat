name: Release Packaging and Deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pypi:
    name: Build PyPI Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build PyPI Packages
        run: |
          python manage.py build --pypi

      - name: Upload PyPI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-packages
          path: dist/*

  build-windows:
    name: Build Standalone Windows Client Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python manage.py setup --dev

      - name: Build Windows Client Binary
        run: |
          python manage.py build --client

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/NexusChat-windows.zip

  build-linux:
    name: Build Standalone Linux Client Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python manage.py setup --dev

      - name: Build Linux Client Binary
        run: |
          python manage.py build --client

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/NexusChat-linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-pypi, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download PyPI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-packages
          path: release-artifacts/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/

      - name: Flatten Release Artifacts
        run: |
          mkdir -p flat-release
          find release-artifacts -type f \( \
            -name "*.whl" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" \
          \) -exec cp {} flat-release/ \;
          echo "Flattened release files:"
          ls -la flat-release/

      - name: Parse Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          # Check candidates in docs/release_notes/
          CANDIDATES=(
            "docs/release_notes/RELEASE_NOTES_V${VERSION}.md"
            "docs/release_notes/RELEASE_NOTES_v${VERSION}.md"
            "docs/release_notes/v${VERSION}.md"
            "docs/release_notes/${VERSION}.md"
            "docs/release_notes/RELEASE_NOTES_${VERSION}.md"
          )

          NOTES_FILE=""
          for cand in "${CANDIDATES[@]}"; do
            if [ -f "$cand" ]; then
              NOTES_FILE="$cand"
              break
            fi
          done

          if [ -n "$NOTES_FILE" ]; then
            echo "Release notes file found: $NOTES_FILE"
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            cat "$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Release notes file NOT found in docs/release_notes/ for version $VERSION"
            echo "notes=No release notes provided for version ${TAG_NAME}." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NexusChat ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: flat-release/*

  publish-pypi:
    name: Publish to PyPI
    needs: build-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Download PyPI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-packages
          path: pypi-dist/

      - name: Set up Python
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Twine
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: pip install twine

      - name: Upload to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload pypi-dist/* --skip-existing

      - name: Skip PyPI publish notice
        if: env.PYPI_API_TOKEN == ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: echo "PYPI_API_TOKEN secret not set - skipping PyPI publication step."
